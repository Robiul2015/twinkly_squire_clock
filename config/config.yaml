# Twinkly Squares Wall Clock Configuration
# Changes to theme are hot-reloaded every 60 seconds (no restart needed).

twinkly_ip: "192.168.1.100"

# Available: ocean_drift, ember_glow, neon_synthwave,
#            minimal_white, aurora_borealis, time_of_day, matrix_terminal
theme: "matrix_terminal"

brightness: 95
fps: 10

# Font: 5x7 (classic), 5x7r (rounded), 5x7b (bold)
font: "5x7"

# Night mode: dims to night_brightness from night_start until sunrise
# Sunrise is calculated automatically for your location
night_brightness: 5     # 5% during night
night_start: 22         # 10 PM

# Your location (for sunrise calculation)
location:
  name: "Sydney"
  region: "Australia"
  latitude: 51.4934
  longitude: 0.0
  timezone: "Australia/Sydney"

# Daytime brightness schedule (24h format, applies after sunrise)
brightness_schedule:
  8: 95     # 8 AM - full brightness
  20: 60    # 8 PM - evening dim
